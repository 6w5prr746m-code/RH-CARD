<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RH CARD</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section id="screen-deckbuilder" class="screen active">
  <header>
    <div>
      <h1>RH CARD — Construction du deck</h1>
      <div class="sub" id="deckbuilder-subtitle">Sélectionnez 25 à 30 cartes parmi les 91 éditeurs du marché SIRH.</div>
      <div class="collection-progress" id="collection-progress-wrap">
        <div class="collection-progress-bar"><div class="collection-progress-fill" id="collection-progress-fill"></div></div>
        <span id="collection-progress-label"></span>
        <span id="streak-label" class="streak-label"></span>
      </div>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <div class="domain-tabs" style="padding:0; border:none;">
        <button id="mode-vsai" class="active">Solo vs IA</button>
        <button id="mode-campaign">Campagne</button>
        <button id="mode-local2p">Duel local (2 joueurs)</button>
      </div>
      <label id="ai-difficulty-label" style="font-size:12px; color:var(--text-dim);">IA :
        <select id="ai-difficulty-select">
          <option value="easy">Facile</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Difficile</option>
        </select>
      </label>
      <button id="btn-theme-toggle-builder" class="icon-btn theme-toggle-btn" title="Basculer thème clair/sombre">🌙</button>
      <button id="btn-options-builder" class="icon-btn" title="Options">⚙️</button>
      <button id="btn-achievements" class="icon-btn" title="Succès">🏆</button>
      <button id="btn-help-builder" class="icon-btn" title="Comment jouer">❓</button>
      <button id="btn-open-booster">🎁 Ouvrir un booster (0)</button>
      <select id="starter-deck-select" title="Deck de démarrage par archétype"></select>
      <button id="btn-random-deck">Deck aléatoire</button>
      <button id="btn-clear-deck">Vider</button>
    </div>
  </header>
  <div class="campaign-panel hidden" id="campaign-panel"></div>
  <div class="domain-tabs" id="domain-tabs"></div>
  <div class="builder-body">
    <div class="pool-grid" id="pool-grid"></div>
    <div class="deck-panel">
      <div class="deck-header">
        <div class="deck-count" id="deck-count">0 / 30</div>
        <div class="curve" id="deck-curve"></div>
      </div>
      <div class="deck-list" id="deck-list"></div>
      <div style="display:flex; gap:6px; padding:8px 16px; border-top:1px solid var(--border);">
        <select id="saved-decks-select" style="flex:1; min-width:0;"><option value="">— Mes decks —</option></select>
        <button id="btn-load-deck" class="icon-btn" title="Charger le deck sélectionné">📂</button>
        <button id="btn-save-deck" class="icon-btn" title="Sauvegarder le deck actuel">💾</button>
        <button id="btn-delete-deck" class="icon-btn" title="Supprimer le deck sélectionné">🗑</button>
      </div>
      <footer>
        <button id="btn-start-game" class="primary" disabled>Lancer la partie</button>
      </footer>
    </div>
  </div>
</section>

<section id="screen-game" class="screen">
  <div id="arena-motes"></div>
  <div class="game-body">
    <div class="top-bar">
      <div class="turn-indicator" id="turn-indicator">Tour 1</div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button id="btn-toggle-side-panel" class="icon-btn side-panel-toggle" title="Synergies / journal">📊</button>
        <button id="btn-theme-toggle-game" class="icon-btn theme-toggle-btn" title="Basculer thème clair/sombre">🌙</button>
        <button id="btn-options-game" class="icon-btn" title="Options">⚙️</button>
        <button id="btn-help-game" class="icon-btn" title="Comment jouer">❓</button>
        <button id="btn-back-to-builder">← Deck builder</button>
      </div>
    </div>
    <div class="hero-row opponent">
      <div class="hero-info">
        <div class="hero-name" id="ai-hero-name">IA adverse</div>
        <div class="hero-hp" id="ai-hp">30 PV</div>
        <div class="hero-mana" id="ai-mana">0 / 0 mana</div>
        <div style="color:var(--text-dim); font-size:12px;">Main: <span id="ai-hand-count">0</span> · Deck: <span id="ai-deck-count">0</span></div>
      </div>
      <div class="hero-target" id="ai-hero-target">🏢 Héros</div>
    </div>
    <div class="board-row opponent" id="ai-board"></div>
    <div class="board-row self" id="player-board"></div>
    <div class="hero-row self">
      <div class="hero-target" id="player-hero-target">🏢 Héros</div>
      <button class="hero-power-btn" id="hero-power-btn" title="Pouvoir héroïque">⚡</button>
      <div class="hero-info">
        <div style="color:var(--text-dim); font-size:12px;">Deck: <span id="player-deck-count">0</span></div>
        <div class="hero-mana" id="player-mana">0 / 0 mana</div>
        <div class="hero-hp" id="player-hp">30 PV</div>
        <div class="hero-name" id="player-hero-name">Vous (PeopleSpheres)</div>
      </div>
    </div>
    <div class="hand-row" id="player-hand"></div>
  </div>

  <div class="game-controls">
    <button id="btn-skip-ai" class="hidden">⏭ Passer le tour de l'IA</button>
    <button id="end-turn-btn">Fin de tour</button>
  </div>

  <div class="side-panel">
    <div class="synergy-list" id="synergy-list"></div>
    <div class="log-panel" id="log-panel"></div>
  </div>

  <div id="pass-device-overlay" class="hidden">
    <div class="pass-device-box">
      <div class="pass-device-icon">🔄</div>
      <div id="pass-device-text">Passez l'appareil</div>
      <button id="pass-device-btn" class="primary">C'est parti</button>
    </div>
  </div>
</section>

<div id="modal-root"></div>
<div id="zoom-root"></div>
<div id="hover-preview" class="hidden"></div>
<div id="fx-root"></div>
<div id="atk-preview" class="hidden"></div>
<div id="toast" class="hidden" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#2c3145; color:#e8e9f0; padding:10px 18px; border-radius:8px; border:1px solid #e0556f; z-index:210; font-size:13px;"></div>

<script src="js/data/cards.js"></script>
<script src="js/data/campaign.js"></script>
<script src="js/data/describe.js"></script>
<script src="js/data/cardart.js"></script>
<script src="js/data/collection.js"></script>
<script src="js/data/progression.js"></script>
<script src="js/data/decks-storage.js"></script>
<script src="js/fx/sfx.js"></script>
<script src="js/fx/vfx.js"></script>
<script src="js/fx/sharecard.js"></script>
<script src="js/engine/synergy.js"></script>
<script src="js/engine/engine.js"></script>
<script src="js/engine/ai.js"></script>
<script src="js/ui/deckbuilder.js"></script>
<script src="js/ui/board.js"></script>
<script src="js/ui/tutorial.js"></script>
<script src="js/main.js"></script>
</body>
</html>
